name: passagen-web

services:
  passagen-web:
    image: passagen-web:local
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        passagen-core: ../passagen-core
    container_name: passagen-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      PASSAGEN_API_KEY: ${PASSAGEN_API_KEY:?Set PASSAGEN_API_KEY in passagen-web/.env}
    command:
      - --allow-origin
      - ${PASSAGEN_ALLOWED_ORIGIN:-http://127.0.0.1:8765}
    ports:
      - "${PASSAGEN_BIND:-127.0.0.1}:8765:8765"
    volumes:
      - ${PASSAGEN_DATA_DIR:-./data}:/data
