stages:
  - lint
  - test
  - build

.python-job:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .uv-cache/
  before_script:
    - uv sync --frozen

.frontend-job:
  image: node:24-bookworm-slim
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefix frontend --prefer-offline

ruff:
  extends: .python-job
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

basedpyright:
  extends: .python-job
  stage: lint
  script:
    - uv run basedpyright

mypy:
  extends: .python-job
  stage: lint
  script:
    - uv run mypy

frontend-lint:
  extends: .frontend-job
  stage: lint
  script:
    - npm --prefix frontend run lint

pytest:
  extends: .python-job
  stage: test
  script:
    - mkdir -p reports/pytest reports/coverage
    - >
      uv run pytest
      -o addopts=""
      --import-mode=importlib
      --cov=passagen_web
      --cov-report=term-missing
      --cov-report=xml:reports/coverage/coverage.xml
      --junitxml=reports/pytest/junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/pytest/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/coverage.xml
    paths:
      - reports/pytest/junit.xml
      - reports/coverage/coverage.xml

frontend-test:
  extends: .frontend-job
  stage: test
  script:
    - mkdir -p reports/vitest
    - >
      npm --prefix frontend run test --
      --reporter=default
      --reporter=junit
      --outputFile.junit=../reports/vitest/junit.xml
  artifacts:
    when: always
    reports:
      junit: reports/vitest/junit.xml
    paths:
      - reports/vitest/junit.xml

frontend-build:
  extends: .frontend-job
  stage: build
  script:
    - npm --prefix frontend run build
  artifacts:
    paths:
      - src/passagen_web/static/
