stages:
  - lint
  - test
  - build

.python-job:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_NO_SYNC: "1"
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .uv-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
    - git clone --depth 1 "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/passagen-cli.git" .ci/passagen-cli
    - uv sync --frozen --no-install-package passagen
    - uv pip install --no-deps .ci/passagen-cli

.frontend-job:
  image: node:24-bookworm-slim
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefix frontend --prefer-offline

ruff:
  extends: .python-job
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

basedpyright:
  extends: .python-job
  stage: lint
  script:
    - uv run basedpyright

mypy:
  extends: .python-job
  stage: lint
  script:
    - uv run mypy

frontend-lint:
  extends: .frontend-job
  stage: lint
  script:
    - npm --prefix frontend run lint

pytest:
  extends: .python-job
  stage: test
  script:
    - mkdir -p reports/pytest reports/coverage
    - >
      uv run pytest
      -o addopts=""
      --import-mode=importlib
      --cov=passagen_web
      --cov-report=term-missing
      --cov-report=xml:reports/coverage/coverage.xml
      --junitxml=reports/pytest/junit.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: reports/pytest/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage/coverage.xml
    paths:
      - reports/pytest/junit.xml
      - reports/coverage/coverage.xml

frontend-test:
  extends: .frontend-job
  stage: test
  script:
    - mkdir -p reports/vitest
    - >
      npm --prefix frontend run test --
      --reporter=default
      --reporter=junit
      --outputFile.junit=../reports/vitest/junit.xml
  artifacts:
    when: always
    reports:
      junit: reports/vitest/junit.xml
    paths:
      - reports/vitest/junit.xml

e2e:
  extends: .frontend-job
  stage: test
  variables:
    UV_NO_SYNC: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates ca-certificates git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - npm ci --prefix frontend --prefer-offline
    - git clone --depth 1 "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/passagen-cli.git" .ci/passagen-cli
    - $HOME/.local/bin/uv sync --frozen --no-install-package passagen
    - $HOME/.local/bin/uv pip install --no-deps .ci/passagen-cli
    - npm --prefix frontend exec -- playwright install --with-deps chromium
  script:
    - PATH="$HOME/.local/bin:$PATH" npm --prefix frontend run test:e2e
  artifacts:
    when: on_failure
    paths:
      - frontend/test-results/

frontend-build:
  extends: .frontend-job
  stage: build
  script:
    - npm --prefix frontend run build
  artifacts:
    paths:
      - src/passagen_web/static/

wheel-build:
  extends: .frontend-job
  stage: build
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - npm ci --prefix frontend --prefer-offline
  script:
    - $HOME/.local/bin/uv build --wheel
    - $HOME/.local/bin/uv run --no-project python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; assert 'passagen_web/static/index.html' in zipfile.ZipFile(p).namelist()"
  artifacts:
    paths:
      - dist/*.whl

build-package:
  extends: .frontend-job
  stage: build
  variables:
    UV_NO_SYNC: "1"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates ca-certificates git
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - npm ci --prefix frontend --prefer-offline
    - git clone --depth 1 "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_NAMESPACE}/passagen-cli.git" .ci/passagen-cli
    - $HOME/.local/bin/uv sync --frozen --no-install-package passagen
    - $HOME/.local/bin/uv pip install --no-deps .ci/passagen-cli
  script:
    - test "v$($HOME/.local/bin/uv run passagen-web --version)" = "$CI_COMMIT_TAG"
    - $HOME/.local/bin/uv build
  artifacts:
    expire_in: never
    paths:
      - dist/
  rules:
    - if: $CI_COMMIT_TAG
